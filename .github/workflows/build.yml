name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get whisper.cpp
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp third_party/whisper.cpp

      - name: Cache Whisper model
        id: model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/ggml-small-q5_1.bin
          key: whisper-ggml-small-q5_1

      - name: Download Whisper Small model (bundled in the APK)
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 5 -o app/src/main/assets/ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          ls -la app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk VoiceBubble.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBubble-apk
          path: VoiceBubble.apk

      - name: Publish to Releases (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VoiceBubble (latest build)
          files: VoiceBubble.apk
          make_latest: true
